services:
  client:
    profiles:
      - frontend
    build:
      context: .
      dockerfile: src/InsightVault.Client/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:5089
    ports:
      - "56772:56772"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      HttpsRedirection__Enabled: false
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=InsightVault;User Id=sa;Password=${INSIGHTVAULT_SQL_PASSWORD:-InsightVault-Local-Only-Password-123!};TrustServerCertificate=True;MultipleActiveResultSets=true
      Jwt__Issuer: InsightVault
      Jwt__Audience: InsightVault.Client
      Jwt__SigningKey: ${INSIGHTVAULT_JWT_SIGNING_KEY:-insightvault-local-docker-signing-key-change-me}
      Jwt__ExpiresMinutes: 60
      AzureBlobStorage__ConnectionString: ${AZURE_BLOB_STORAGE_CONNECTION_STRING:-}
      AzureBlobStorage__ContainerName: ${AZURE_BLOB_STORAGE_CONTAINER_NAME:-documents}
      AzureOpenAI__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      AzureOpenAI__ApiKey: ${AZURE_OPENAI_API_KEY:-}
      AzureOpenAI__EmbeddingDeploymentName: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-}
      AzureOpenAI__ChatDeploymentName: ${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME:-}
      AzureOpenAI__ApiVersion: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      Queue__Provider: ${QUEUE_PROVIDER:-Disabled}
      Queue__Region: ap-southeast-2
      Queue__QueueUrl: ${QUEUE_URL:-}
      Queue__ServiceUrl: ${QUEUE_SERVICE_URL:-}
    ports:
      - "5089:8080"
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${INSIGHTVAULT_SQL_PASSWORD:-InsightVault-Local-Only-Password-123!}
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  postgres:
    profiles:
      - postgres
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: InsightVault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${INSIGHTVAULT_POSTGRES_PASSWORD:-InsightVault-Local-Only-Password-123!}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d InsightVault"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  s3mock:
    profiles:
      - s3
    image: adobe/s3mock:5.2.2
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: insightvault-documents
    ports:
      - "9090:9090"

  localstack:
    profiles: [queue]
    image: localstack/localstack:4.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ap-southeast-2
    ports:
      - "4566:4566"

  worker:
    profiles: [queue]
    build:
      context: .
      dockerfile: src/InsightVault.Worker/Dockerfile
    environment:
      Database__Provider: SqlServer
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=InsightVault;User Id=sa;Password=${INSIGHTVAULT_SQL_PASSWORD:-InsightVault-Local-Only-Password-123!};TrustServerCertificate=True;MultipleActiveResultSets=true
      Queue__Provider: LocalStack
      Queue__Region: ap-southeast-2
      Queue__QueueUrl: ${QUEUE_URL:-}
      Queue__ServiceUrl: http://localstack:4566
    depends_on:
      - sqlserver
      - localstack

volumes:
  sqlserver-data:
  postgres-data:
