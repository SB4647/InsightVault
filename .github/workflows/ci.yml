name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-configuration:
    name: Agent configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate agent profiles and YAML frontmatter
        run: python .github/scripts/validate-agents.py

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore src/InsightVault.Api/InsightVault.Api.csproj

      - name: Restore worker
        run: dotnet restore src/InsightVault.Worker/InsightVault.Worker.csproj

      - name: Restore tests
        run: dotnet restore tests/InsightVault.Tests/InsightVault.Tests.csproj

      - name: Build API
        run: dotnet build src/InsightVault.Api/InsightVault.Api.csproj --configuration Release --no-restore

      - name: Build worker
        run: dotnet build src/InsightVault.Worker/InsightVault.Worker.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/InsightVault.Tests/InsightVault.Tests.csproj --configuration Release --no-restore --verbosity normal

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/InsightVault.Client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/InsightVault.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

  docker:
    name: Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file Dockerfile --tag insightvault-api:ci .

      - name: Build worker image
        run: docker build --file src/InsightVault.Worker/Dockerfile --tag insightvault-worker:ci .

      - name: Build frontend image
        run: docker build --file src/InsightVault.Client/Dockerfile --tag insightvault-client:ci .

      - name: Validate default Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate AWS-aligned Compose profiles
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.queue.yml
          --profile frontend
          --profile postgres
          --profile s3
          --profile queue
          config --quiet

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  aws-terraform:
    name: AWS Terraform validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/aws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
