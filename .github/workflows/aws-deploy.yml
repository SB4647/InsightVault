name: AWS deployment (manual approval required)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        options: [development, staging, production]
      operation:
        description: "Terraform operation"
        required: true
        type: choice
        options: [validate, plan, apply]
        default: validate
      confirmation:
        description: "For apply only, type APPLY followed by the environment name (for example, APPLY production)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: inputs.operation == 'validate'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    if: (inputs.operation == 'plan' || inputs.operation == 'apply') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Plan environments have read-only AWS roles and no required reviewer. They never apply changes.
    environment: plan-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure read-only AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Initialise protected remote state
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.AWS_TF_STATE_LOCK_TABLE }}"
          -backend-config="region=ap-southeast-2"
          -backend-config="key=insightvault/${{ inputs.environment }}/terraform.tfstate"
          -backend-config="encrypt=true"
      - name: Materialise reviewed deployment configuration
        shell: bash
        env:
          TFVARS_JSON: ${{ secrets.AWS_TFVARS_JSON }}
        run: printf '%s' "$TFVARS_JSON" > deployment.auto.tfvars.json
      - run: terraform validate
      - run: terraform plan -out=terraform.tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: insightvault-${{ inputs.environment }}-terraform-plan
          path: infra/aws/terraform.tfplan
          retention-days: 1

  apply:
    if: inputs.operation == 'apply' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    # Deployment environments provide the out-of-repository arming switch and OIDC boundary.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Verify deliberate deployment intent
        shell: bash
        env:
          DEPLOYMENT_ARMED: ${{ vars.DEPLOYMENT_ARMED }}
          CONFIRMATION: ${{ inputs.confirmation }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ "$DEPLOYMENT_ARMED" != "true" ]; then
            echo "::error::Deployment is disarmed. Set the DEPLOYMENT_ARMED variable to true in the selected GitHub Environment before deliberately retrying."
            exit 1
          fi

          if [ "$CONFIRMATION" != "APPLY $TARGET_ENVIRONMENT" ]; then
            echo "::error::Confirmation must be exactly: APPLY $TARGET_ENVIRONMENT"
            exit 1
          fi
      - name: Configure deployment AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Initialise protected remote state
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}"
          -backend-config="dynamodb_table=${{ vars.AWS_TF_STATE_LOCK_TABLE }}"
          -backend-config="region=ap-southeast-2"
          -backend-config="key=insightvault/${{ inputs.environment }}/terraform.tfstate"
          -backend-config="encrypt=true"
      - uses: actions/download-artifact@v4
        with:
          name: insightvault-${{ inputs.environment }}-terraform-plan
          path: infra/aws
      - name: Apply the exact reviewed plan
        run: terraform apply -auto-approve terraform.tfplan
